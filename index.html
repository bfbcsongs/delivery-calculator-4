<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Miki Table & Ledger</title>

    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- DYNAMIC SETUP / CONFIRMATION MODAL -->
    <div id="setupModal" class="setup-modal-overlay">
        <div class="setup-modal">
            <button class="modal-close-btn" onclick="closeSetupModal()" title="Close">&times;</button>
            <h3 id="modalTitle">Start New Ledger File</h3>
            <p id="modalSubtext" style="font-size: 12px; color: #6b7280;">Please fill out both the Date and Name to unlock encoding.</p>
            <label for="modalDateInput">Date</label>
            <input type="date" id="modalDateInput">
            <label for="modalNameInput">Route / Salesman Name</label>
            <input type="text" id="modalNameInput" placeholder="e.g. Route A - John">
            <button id="modalActionBtn" class="setup-btn" onclick="handleModalSubmit()">Open Ledger</button>
        </div>
    </div>

    <div class="main-wrapper">
        <!-- FIRST TABLE -->
        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Qty</th>
                        <th id="priceLockHeader" class="lockable-header" onclick="handlePriceKeyClick()" title="Tap 5 times to Lock/Unlock Prices">Price 🔒</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="miki">REG</td>
                        <td><input type="number" id="qtyReg" min="0" step="any" oninput="syncFromTable('Reg')"></td>
                        <td><input type="number" id="priceReg" class="price-input" min="0" step="any" value="45" oninput="calculateMain()" readonly style="background-color: #e5e7eb;"></td>
                        <td class="amount" id="amountReg">0</td>
                    </tr>
                    <tr>
                        <td class="miki">FRESH</td>
                        <td><input type="number" id="qtyFresh" min="0" step="any" oninput="syncFromTable('Fresh')"></td>
                        <td><input type="number" id="priceFresh" class="price-input" min="0" step="any" value="45" oninput="calculateMain()" readonly style="background-color: #e5e7eb;"></td>
                        <td class="amount" id="amountFresh">0</td>
                    </tr>
                    <tr>
                        <td class="miki">CAB</td>
                        <td><input type="number" id="qtyCab" min="0" step="any" oninput="syncFromTable('Cab')"></td>
                        <td><input type="number" id="priceCab" class="price-input" min="0" step="any" value="40" oninput="calculateMain()" readonly style="background-color: #e5e7eb;"></td>
                        <td class="amount" id="amountCab">0</td>
                    </tr>
                    <tr>
                        <td class="miki">BO</td>
                        <td><input type="number" id="qtyBo" min="0" step="any" oninput="syncFromTable('Bo')"></td>
                        <td><input type="number" id="priceBo" class="price-input" min="0" step="any" value="45" oninput="calculateMain()" readonly style="background-color: #e5e7eb;"></td>
                        <td class="amount" id="amountBo">0</td>
                    </tr>
                    <tr>
                        <td class="miki">TOTAL</td>
                        <td></td>
                        <td></td>
                        <td class="amount" id="totalAmount">0</td>
                    </tr>
                    <tr>
                        <td colspan="2" rowspan="2" id="activeCustomerDisplay" class="active-customer-box">
                            Row 1
                        </td>
                        <td class="label-cell">BAL</td>
                        <td><input type="number" id="inputBal" min="0" step="any" class="direct-amount-input" oninput="calculateMain()"></td>
                    </tr>
                    <tr>
                        <td class="label-cell">PAY</td>
                        <td><input type="number" id="inputPay" min="0" step="any" class="direct-amount-input" oninput="calculateMain()"></td>
                    </tr>
                    <tr>
                        <td class="miki-net-total-large">NET TOTAL</td>
                        <td></td>
                        <td></td>
                        <td class="net-total-large" id="netTotalAmount">0</td>
                    </tr>
                </tbody>
            </table>

            <div class="sync-panel">
                <div class="sync-cell">
                    <label>Dry</label>
                    <input type="number" id="syncDry" min="0" step="any" oninput="syncFromPanel('Dry')">
                </div>
                <div class="sync-cell">
                    <label>Fresh</label>
                    <input type="number" id="syncFresh" min="0" step="any" oninput="syncFromPanel('Fresh')">
                </div>
                <div class="sync-cell">
                    <label>Cab</label>
                    <input type="number" id="syncCab" min="0" step="any" oninput="syncFromPanel('Cab')">
                </div>
                <div class="sync-cell">
                    <label>BO</label>
                    <input type="number" id="syncBo" min="0" step="any" oninput="syncFromPanel('Bo')">
                </div>
                <div class="btn-container">
                    <button id="installBtn" class="action-btn install-btn" onclick="installApp()">INSTALL</button>
                    <button class="action-btn clear-btn" onclick="clearMainInputs()">CLEAR</button>
                </div>
            </div>
        </div>

        <!-- SESSION HEADER ABOVE TABLE 2 -->
        <div class="session-bar">
            <div class="session-info">
                <span id="displayFileDate">Date: --</span>
                <span>|</span>
                <span id="displayFileName">--</span>
            </div>
            <div>
                <button class="btn-sm btn-edit" onclick="openSaveConfirmationModal()">Save</button>
                <button class="btn-sm btn-del" onclick="promptNewFile()">New</button>
            </div>
        </div>

        <!-- SECOND TABLE (LEDGER TABLE) -->
        <div class="table-box table-box-2">
            <table>
                <thead>
                    <tr>
                        <th id="lockHeader" class="lockable-header" onclick="handleKeyClick()" title="Tap 5 times to Lock/Unlock Customer Names">🔒 Name</th>
                        <th>Dry</th>
                        <th>Fresh</th>
                        <th>Cab</th>
                        <th>BO</th>
                        <th>Bal</th>
                        <th>Billing</th>
                        <th class="colln-header">Pay</th>
                        <th>Rem</th>
                    </tr>
                </thead>
                <tbody id="ledgerTableBody">
                    <!-- Dynamic 16 Rows Generated via JS -->
                </tbody>
                <tfoot>
                    <tr style="font-weight: bold; background: #f3f4f6;">
                        <td style="text-align: center; font-weight: bold;">TOTAL</td>
                        <td id="totalDry">0</td>
                        <td id="totalFresh">0</td>
                        <td id="totalCab">0</td>
                        <td id="totalBo">0</td>
                        <td id="totalBal">0</td>
                        <td id="totalBilling">0</td>
                        <td id="totalColln">0</td>
                        <td id="totalRem">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- 30-DAY HISTORY DRAWER -->
        <div class="history-section">
            <div class="history-title">
                <span>30-Day History Files</span>
                <span id="historyCount" style="font-size: 11px; color: #6b7280;">0 / 30</span>
            </div>
            <div class="history-list" id="historyContainer">
                <!-- History Items Rendered Dynamically -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
